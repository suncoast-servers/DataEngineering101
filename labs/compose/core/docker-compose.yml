services:
  postgres:
    image: postgres:16-alpine
    profiles: [core, batch]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-de101}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-de101_local_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-de101}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-de101} -d ${POSTGRES_DB:-de101}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    profiles: [core, batch]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-de101minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-de101_local_change_me}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
